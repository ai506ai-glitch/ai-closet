<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Closet</title>

<style>
body{
  font-family:sans-serif;
  background:#f5f5f5;
  padding:20px;
  max-width:900px;
  margin:auto;
}

.card{
  background:white;
  border-radius:12px;
  padding:24px;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}

button{
  background:#0078d4;
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
}

button:hover{
  background:#0064b5;
}

.loading{
  color:#666;
}
</style>
</head>

<body>

<h1>AI Closet</h1>

<div class="card">

<h3>条件指定</h3>

<p>

季節

<select id="season">

<option value="all">
すべて
</option>

<option value="春">
春
</option>

<option value="夏">
夏
</option>

<option value="秋">
秋
</option>

<option value="冬">
冬
</option>

</select>

</p>

<p>

使いたいアイテム

<select id="fixedItem">
<option value="">
指定なし
</option>
</select>

</p>

<button onclick="generateOutfit()">
コーデ生成
</button>

</div>

<br>

<div class="card">

<h2>今日のおすすめコーデ</h2>

<div id="result" class="loading">
Wardrobe.csv を読み込み中...
</div>

<br>

<button onclick="generateOutfit()">
別のコーデを提案
</button>

</div>


<script>

let tops = [];
let bottoms = [];
let shoes = [];
let bags = [];
let inners = [];
let outers = [];
let allItems = [];

async function loadCSV() {

  try {

    const response = await fetch("Wardrobe.csv");

    const text =
      await response.text();

    const rows =
      text.split(/\r?\n/);

    rows.slice(1).forEach(row => {

      if(!row.trim()) return;

      const cols = row.split(",");

      const item = {

        id: cols[0]?.trim(),
        category: cols[1]?.trim(),
        name: cols[2]?.trim(),
        color: cols[3]?.trim(),
        pattern: cols[4]?.trim(),
        material: cols[5]?.trim(),
        season: cols[6]?.trim(),
        taste: cols[7]?.trim(),
        easyMatch: cols[8]?.trim(),
        memo: cols[9]?.trim(),
        image: cols[10]?.trim()

      };

      if(!item.id) return;

      allItems.push(item);

      if(item.id.startsWith("T")) tops.push(item);
      if(item.id.startsWith("B")) bottoms.push(item);
      if(item.id.startsWith("S")) shoes.push(item);
      if(item.id.startsWith("A")) bags.push(item);
      if(item.id.startsWith("I")) inners.push(item);
      if(item.id.startsWith("O")) outers.push(item);

    });

    buildSelector();

    generateOutfit();

  }
  catch(error){

    document.getElementById("result")
      .innerHTML =
      "CSVの読込に失敗しました";

    console.error(error);
  }

}

function buildSelector(){

  const select =
    document.getElementById("fixedItem");

  allItems.forEach(item=>{

    const option =
      document.createElement("option");

    option.value = item.id;

    option.textContent =
      `${item.id} : ${item.name}`;

    select.appendChild(option);

  });

}

function randomItem(arr){

  if(!arr || arr.length === 0){
    return null;
  }

  return arr[
    Math.floor(
      Math.random() * arr.length
    )
  ];

}

function seasonMatch(item, season){

  if(season === "all"){
    return true;
  }

  return (
    item.season || ""
  ).includes(season);

}

function colorWarning(top,bottom){

  const darkWords = [

    "ブラック",
    "黒",
    "ネイビー",
    "紺",
    "チャコール",
    "ダークグレー",
    "ダークブラウン",
    "ダークネイビー"

  ];

  const topDark =
    darkWords.some(word =>
      (top.color || "")
      .includes(word)
    );

  const bottomDark =
    darkWords.some(word =>
      (bottom.color || "")
      .includes(word)
    );

  if(topDark && bottomDark){

    return `
      <p style="color:#d35400;">
      ⚠ トップスとボトムスが濃色同士です
      </p>
    `;

  }

  return "";

}

function generateOutfit(){

  const season =
    document.getElementById("season").value;

  const fixedId =
    document.getElementById("fixedItem").value;

  let top =
    randomItem(
      tops.filter(
        x=>seasonMatch(x,season)
      )
    );

  let bottom =
    randomItem(
      bottoms.filter(
        x=>seasonMatch(x,season)
      )
    );

  let shoe =
    randomItem(
      shoes.filter(
        x=>seasonMatch(x,season)
      )
    );

  let bag =
    randomItem(bags);

  let inner =
    randomItem(inners);

  let outer =
    randomItem(
      outers.filter(
        x=>seasonMatch(x,season)
      )
    );

  if(fixedId){

    const fixed =
      allItems.find(
        x=>x.id===fixedId
      );

    if(fixed){

      if(fixed.id.startsWith("T"))
        top = fixed;

      if(fixed.id.startsWith("B"))
        bottom = fixed;

      if(fixed.id.startsWith("S"))
        shoe = fixed;

      if(fixed.id.startsWith("A"))
        bag = fixed;

      if(fixed.id.startsWith("I"))
        inner = fixed;

      if(fixed.id.startsWith("O"))
        outer = fixed;

    }

  }

  if(
    !top ||
    !bottom ||
    !shoe
  ){

    document.getElementById("result")
      .innerHTML =
      "条件に一致するアイテムがありません";

    return;

  }

  document.getElementById("result").innerHTML = `

  <h3>おすすめコーデ</h3>

  <p><strong>インナー</strong><br>
  ${inner.id}：${inner.name}</p>

  <p><strong>トップス</strong><br>
  ${top.id}：${top.name}</p>

  ${outer ? `
  <p><strong>アウター</strong><br>
  ${outer.id}：${outer.name}</p>
  ` : ""}

  <p><strong>ボトムス</strong><br>
  ${bottom.id}：${bottom.name}</p>

  <p><strong>シューズ</strong><br>
  ${shoe.id}：${shoe.name}</p>

  <p><strong>バッグ</strong><br>
  ${bag.id}：${bag.name}</p>

  ${colorWarning(top,bottom)}

  <hr>

  <h4>コーデポイント</h4>

  <p>${top.memo || ""}</p>

  <hr>

  <h4>画像ファイル</h4>

  <p>${top.image || ""}</p>

  <p>${bottom.image || ""}</p>

  <p>${shoe.image || ""}</p>

  `;

}

loadCSV();

</script>


</body>
</html>
