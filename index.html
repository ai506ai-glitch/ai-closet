<!DOCTYPE html>
<html lang="ja">
<head>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>AI Closet</title>

<style>
body{
  font-family:sans-serif;
  background:#f5f5f5;
  padding:20px;
  max-width:900px;
  margin:auto;
}

.card{
  background:white;
  border-radius:12px;
  padding:24px;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}

button{
  background:#0078d4;
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
}

button:hover{
  background:#0064b5;
}

.loading{
  color:#666;
}

.gallery{
  display:flex;
  flex-wrap:wrap;
  gap:16px;
  margin-top:20px;
}

.thumb{
  width:180px;
  background:#fafafa;
  border:1px solid #ddd;
  border-radius:10px;
  padding:10px;
}

.thumb img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:6px;
}

.score-good{
  color:#2e7d32;
  font-weight:bold;
  font-size:28px;
}

.score-mid{
  color:#ef6c00;
  font-weight:bold;
  font-size:28px;
}

.score-low{
  color:#c62828;
  font-weight:bold;
  font-size:28px;
}

</style>
</head>

<body>

<h1>AI Closet</h1>

<div class="card">

<h3>条件指定</h3>

<p>

季節

<select id="season">

<option value="all">
すべて
</option>

<option value="春">
春
</option>

<option value="夏">
夏
</option>

<option value="秋">
秋
</option>

<option value="冬">
冬
</option>

</select>

</p>

<p>

使いたいアイテム

<select id="fixedItem">
<option value="">
指定なし
</option>
</select>

</p>

<button onclick="generateOutfit()">
コーデ生成
</button>

</div>

<br>

<div class="card">
      
<h2>今日のおすすめコーデ</h2>

<div id="result" class="loading">
Wardrobe.csv を読み込み中です。読み込めない場合は、下のボタンからCSVファイルを選択してください。
</div>
<p>
  <label for="csvFile">Wardrobe.csv を選択：</label>
  <input type="file" id="csvFile" accept=".csv,text/csv">
</p>

<br>

<button onclick="generateOutfit()">
別のコーデを提案
</button>

</div>


<script>

let allItems = [];

let tops = [];
let bottoms = [];
let shoes = [];
let bags = [];
let inners = [];
let outers = [];

const HISTORY_KEY = "aiClosetHistory";

function loadCSV(){
  const result = document.getElementById("result");
  result.textContent = "Wardrobe.csv を読み込み中...";

  // 同じフォルダーからの自動読み込みを試す（HTTP/HTTPSで開いた場合）
  Papa.parse("Wardrobe.csv", {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      const rows = (results.data || []).filter(item => item.ID && item.ID.trim());
      if (rows.length === 0) {
        showCSVHelp("Wardrobe.csv を自動で読み込めませんでした。下のファイル選択からCSVを指定してください。");
        return;
      }
      setWardrobeData(rows);
    },
    error: function(error) {
      console.error("CSV読み込みエラー:", error);
      showCSVHelp("Wardrobe.csv を自動で読み込めませんでした。下のファイル選択からCSVを指定してください。");
    }
  });
}

function showCSVHelp(message) {
  const result = document.getElementById("result");
  result.className = "loading";
  result.textContent = message;
}

function setWardrobeData(rows) {
  allItems = rows;
  tops = allItems.filter(item => item.ID.startsWith("T"));
  bottoms = allItems.filter(item => item.ID.startsWith("B"));
  shoes = allItems.filter(item => item.ID.startsWith("S"));
  bags = allItems.filter(item => item.ID.startsWith("A"));
  inners = allItems.filter(item => item.ID.startsWith("I"));
  outers = allItems.filter(item => item.ID.startsWith("O"));

  buildSelector();
  generateOutfit();
}

document.getElementById("csvFile").addEventListener("change", function(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  Papa.parse(file, {
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      const rows = (results.data || []).filter(item => item.ID && item.ID.trim());
      if (rows.length === 0) {
        showCSVHelp("CSVからID列のデータを読み取れませんでした。CSVの列名が「ID」か確認してください。");
        return;
      }
      setWardrobeData(rows);
    },
    error: function(error) {
      console.error("CSV解析エラー:", error);
      showCSVHelp("CSVを解析できませんでした。ファイル形式を確認してください。");
    }
  });
});

function buildSelector(){

  const select =
    document.getElementById("fixedItem");

  select.innerHTML =
    '<option value="">指定なし</option>';

  allItems.forEach(item => {

    const option =
      document.createElement("option");

    option.value = item.ID;

    option.textContent =
      `${item.ID} ${item.アイテム}`;

    select.appendChild(option);

  });

}

function seasonMatch(item, season){

  if(season==="all") return true;

  return (
    item["季節"] || ""
  ).includes(season);

}

function randomItem(arr){

  if(arr.length===0) return null;

  return arr[
    Math.floor(
      Math.random()*arr.length
    )
  ];

}

function calculateScore(a,b){

  let score = 50;

  let reasons = [];

  const tastesA =
    (a["テイスト"]||"")
      .split("・");

  const tastesB =
    (b["テイスト"]||"")
      .split("・");

  const common =
    tastesA.filter(x =>
      tastesB.includes(x)
    );

  if(common.length){

    const add =
      common.length * 10;

    score += add;

    reasons.push(
      `テイスト一致 +${add}`
    );

  }

  if(
    (a["合わせやすさ"]||"")
      .includes("高")
  ){
    score += 10;

    reasons.push(
      "A合わせやすさ高 +10"
    );
  }

  if(
    (b["合わせやすさ"]||"")
      .includes("高")
  ){
    score += 10;

    reasons.push(
      "B合わせやすさ高 +10"
    );
  }

  const seasons =
    ["春","夏","秋","冬"];

  let seasonCount = 0;

  seasons.forEach(s => {

    if(
      (a["季節"]||"")
        .includes(s)
      &&
      (b["季節"]||"")
        .includes(s)
    ){
      seasonCount++;
    }

  });

  if(seasonCount){

    const add =
      seasonCount * 5;

    score += add;

    reasons.push(
      `季節一致 +${add}`
    );

  }

  const darkWords = [

    "ブラック",
    "黒",
    "ネイビー",
    "紺",
    "チャコール",
    "ダークグレー",
    "ダークブラウン",
    "ダークネイビー"

  ];

  const darkA =
    darkWords.some(word =>
      (a["色"]||"")
        .includes(word)
    );

  const darkB =
    darkWords.some(word =>
      (b["色"]||"")
        .includes(word)
    );

  if(darkA && darkB){

    score -= 15;

    reasons.push(
      "濃色同士 -15"
    );

  }

  if(
    (a["柄"]||"")
      .includes("チェック")
    &&
    (b["柄"]||"")
      .includes("チェック")
  ){

    score -= 10;

    reasons.push(
      "柄同士 -10"
    );

  }

  score =
    Math.min(
      100,
      Math.max(0,score)
    );

  return {
    score,
    reasons
  };

}

function calculateOverallScore(
  bottomScore,
  shoeScore,
  bagScore
){

  return Math.round(
    (
      bottomScore.score +
      shoeScore.score +
      bagScore.score
    ) / 3
  );

}

function scoreClass(score){

  if(score >= 90){
    return "score-good";
  }

  if(score >= 75){
    return "score-mid";
  }

  return "score-low";

}

function scoreComment(score){

  if(score >= 90){
    return "かなり相性の良い鉄板コーデです";
  }

  if(score >= 80){
    return "相性の良いおすすめコーデです";
  }

  if(score >= 70){
    return "無難にまとまるコーデです";
  }

  return "やや冒険的な組み合わせです";

}

function saveHistory(ids){

  const history =
    JSON.parse(
      localStorage.getItem(
        HISTORY_KEY
      ) || "[]"
    );

  history.push({

    date:
      Date.now(),

    ids

  });

  localStorage.setItem(
    HISTORY_KEY,
    JSON.stringify(history)
  );

}

function getRecentIds(days=7){

  const history =
    JSON.parse(
      localStorage.getItem(
        HISTORY_KEY
      ) || "[]"
    );

  const limit =
    Date.now() -
    (days*24*60*60*1000);

  const ids = [];

  history.forEach(h=>{

    if(h.date > limit){

      ids.push(...h.ids);

    }

  });

  return ids;

}

function pickBestMatch(baseItem, candidates){

  let best = null;

  let bestResult = null;

  candidates.forEach(item => {

    const result =
      calculateScore(
        baseItem,
        item
      );

    if(
      !bestResult ||
      result.score >
      bestResult.score
    ){

      best = item;
      bestResult = result;

    }

  });

  if (!best || !bestResult) {
    return { item: null, score: { score: 0, reasons: ["候補アイテムなし"] } };
  }

  return {
    item: best,
    score: bestResult
  };

}

function generateOutfit(){

  const season =
    document
    .getElementById("season")
    .value;

  const fixedId =
    document
    .getElementById("fixedItem")
    .value;

  const recentIds =
    getRecentIds();

  let availableTops =
    tops.filter(x =>
      seasonMatch(x,season)
      &&
      !recentIds.includes(x.ID)
    );

  let top =
    randomItem(
      availableTops
    );

  if(fixedId){

    const fixed =
      allItems.find(
        x => x.ID === fixedId
      );

    if(fixed)
      top = fixed;

  }

  if(!top){

    document.getElementById(
      "result"
    ).innerHTML =
      "候補がありません";

    return;

  }

  const bottomResult =
    pickBestMatch(

      top,

      bottoms.filter(x =>
        seasonMatch(x,season)
      )

    );

  if (!bottomResult.item) {
    document.getElementById("result").textContent = "条件に合うボトムスがありません。季節条件またはCSVのデータを確認してください。";
    return;
  }

  const shoeResult =
    pickBestMatch(

      bottomResult.item,

      shoes

    );

  const bagResult =
    pickBestMatch(

      bottomResult.item,

      bags

    );

  if (!shoeResult.item || !bagResult.item) {
    document.getElementById("result").textContent = "シューズまたはバッグの候補がありません。CSVにSから始まるIDとAから始まるIDがあるか確認してください。";
    return;
  }

  const inner =
    randomItem(inners);

  const outer =
    randomItem(

      outers.filter(x =>
        seasonMatch(x,season)
      )

    );

const overallScore =
  calculateOverallScore(
    bottomResult.score,
    shoeResult.score,
    bagResult.score
  );

console.log("選択アイテム:", top);
const topImg =
  createImagePath(top);
console.log(topImg);


const bottomImg =
  createImagePath(bottomResult.item);

const shoeImg =
  createImagePath(shoeResult.item);

      
  saveHistory([

    top.ID,
    bottomResult.item.ID,
    shoeResult.item.ID

  ]);

  document.getElementById(
    "result"
  ).innerHTML = `

  <h3>おすすめコーデ</h3>

<hr>

<h2>総合評価</h2>

<p class="${
scoreClass(overallScore)
}">
${overallScore} 点
</p>

<p>
${scoreComment(overallScore)}
</p>

  <p><b>インナー</b><br>
  ${inner?.ID || ""}：
  ${inner?.アイテム || ""}</p>

  <p><b>トップス</b><br>
  ${top.ID}：
  ${top.アイテム}</p>

  ${outer ? `
  <p><b>アウター</b><br>
  ${outer.ID}：
  ${outer.アイテム}</p>
  ` : ""}

  <p><b>ボトムス</b><br>
  ${bottomResult.item.ID}：
  ${bottomResult.item.アイテム}</p>

  <p><b>シューズ</b><br>
  ${shoeResult.item.ID}：
  ${shoeResult.item.アイテム}</p>

  <p><b>バッグ</b><br>
  ${bagResult.item.ID}：
  ${bagResult.item.アイテム}</p>

  <hr>

  <h3>
  トップス × ボトムス
  </h3>

  <p>
  スコア：
  ${bottomResult.score.score}
  点
  </p>

  <ul>
  ${bottomResult.score.reasons
  .map(
    r => `<li>${r}</li>`
  )
  .join("")}
  </ul>

  <h3>
  ボトムス × シューズ
  </h3>

  <p>
  スコア：
  ${shoeResult.score.score}
  点
  </p>

  <ul>
  ${shoeResult.score.reasons
  .map(
    r => `<li>${r}</li>`
  )
  .join("")}
  </ul>

  <h3>
  ボトムス × バッグ
  </h3>

  <p>
  スコア：
  ${bagResult.score.score}
  点
  </p>

  <ul>
  ${bagResult.score.reasons
  .map(
    r => `<li>${r}</li>`
  )
  .join("")}
  </ul>

  <hr>

  <h3>コーデポイント</h3>

  <p>
  ${top["着こなしメモ"] || ""}
  </p>
<hr>

<h3>アイテム画像</h3>

<div class="gallery">

<div class="thumb">

<h4>トップス</h4>

<img
src="${topImg}"
onerror="this.style.display='none'"
>

<div>
${top.ID}
</div>

</div>

<div class="thumb">

<h4>ボトムス</h4>

<img
src="${bottomImg}"
onerror="this.style.display='none'"
>

<div>
${bottomResult.item.ID}
</div>

</div>

<div class="thumb">

<h4>シューズ</h4>

<img
src="${shoeImg}"
onerror="this.style.display='none'"
>

<div>
${shoeResult.item.ID}
</div>

</div>

</div>
  `;

}

function createImagePath(item){

  if(!item){
    return "";
  }

  const imageFile =
    (
      item["画像"] ||
      item["image"] ||
      ""
    )
    .split(" / ")[0]
    .trim();

  if(!imageFile){
    return "";
  }

  const id = item.ID;

  let path = "";

  if(id.startsWith("T")){
    path = `Tops/${imageFile}`;
  }
  else if(id.startsWith("B")){
    path = `Bottoms/${imageFile}`;
  }
  else if(id.startsWith("S")){
    path = `Shoes/${imageFile}`;
  }
  else if(id.startsWith("A")){
    path = `Bags/${imageFile}`;
  }
  else if(id.startsWith("I")){
    path = `Inner/${imageFile}`;
  }
  else if(id.startsWith("O")){
    path = `Outer/${imageFile}`;
  }

  console.log(
    item.ID,
    imageFile,
    path
  );

  return path;
}

loadCSV();

</script>


</body>
</html>
