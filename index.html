<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Closet</title>

<style>
body{
  font-family:sans-serif;
  background:#f5f5f5;
  padding:20px;
  max-width:900px;
  margin:auto;
}

.card{
  background:white;
  border-radius:12px;
  padding:24px;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}

button{
  background:#0078d4;
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
}

button:hover{
  background:#0064b5;
}

.loading{
  color:#666;
}
</style>
</head>

<body>

<h1>AI Closet</h1>

<div class="card">

<h2>今日のおすすめコーデ</h2>

<div id="result" class="loading">
Wardrobe.csv を読み込み中...
</div>

<br>

<button onclick="generateOutfit()">
別のコーデを提案
</button>

</div>

<script>

const tops = [
  {id:"T003", name:"白長袖シャツ"},
  {id:"T015", name:"ライトブルーデニムシャツ"},
  {id:"T028", name:"ネイビー長袖コットンスウェットジャケット"},
  {id:"T001", name:"ブルーグレー長袖シャツ"},
  {id:"T005", name:"白半袖シャツ"}
];

const bottoms = [
  {id:"B021", name:"ベージュコーデュロイパンツ"},
  {id:"B039", name:"真紺ジーンズ"},
  {id:"B040", name:"紺ジーンズ"},
  {id:"B017", name:"ダークブラウンコーデュロイパンツ"},
  {id:"B029", name:"カーキパンツ"}
];

const shoes = [
  {id:"S011", name:"adidas COUNTRY 黒"},
  {id:"S012", name:"adidas SAMBA オレンジ"},
  {id:"S005", name:"New Balance CM996 グレー"},
  {id:"S006", name:"New Balance CM996 ベージュ"}
];

function randomItem(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function generateOutfit(){

  const top = randomItem(tops);
  const bottom = randomItem(bottoms);
  const shoe = randomItem(shoes);

  document.getElementById("result").innerHTML = `
    <p><strong>トップス</strong><br>
    ${top.id}：${top.name}</p>

    <p><strong>ボトムス</strong><br>
    ${bottom.id}：${bottom.name}</p>

    <p><strong>シューズ</strong><br>
    ${shoe.id}：${shoe.name}</p>
  `;
}

generateOutfit();

</script>

</body>
</html>
