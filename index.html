<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Closet</title>

<style>
body{
  font-family:sans-serif;
  background:#f5f5f5;
  padding:20px;
  max-width:900px;
  margin:auto;
}

.card{
  background:white;
  border-radius:12px;
  padding:24px;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}

button{
  background:#0078d4;
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
}

button:hover{
  background:#0064b5;
}

.loading{
  color:#666;
}
</style>
</head>

<body>

<h1>AI Closet</h1>

<div class="card">

<h2>今日のおすすめコーデ</h2>

<div id="result" class="loading">
Wardrobe.csv を読み込み中...
</div>

<br>

<button onclick="generateOutfit()">
別のコーデを提案
</button>

</div>

<script>

let tops = [];
let bottoms = [];
let shoes = [];

async function loadCSV() {

  const response = await fetch("Wardrobe.csv");
  const text = await response.text();

  const rows = text.split(/\r?\n/);

  rows.slice(1).forEach(row => {

    if (!row.trim()) return;

    const cols = row.split(",");

    const id = cols[0]?.trim();
    const category = cols[1]?.trim();
    const itemName = cols[2]?.trim();

    if (!id || !itemName) return;

    const item = {
      id: id,
      name: itemName
    };

    if (id.startsWith("T")) {
      tops.push(item);
    }

    if (id.startsWith("B")) {
      bottoms.push(item);
    }

    if (id.startsWith("S")) {
      shoes.push(item);
    }

  });

  generateOutfit();
}

function randomItem(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function generateOutfit() {

  if (
    tops.length === 0 ||
    bottoms.length === 0 ||
    shoes.length === 0
  ) return;

  const top = randomItem(tops);
  const bottom = randomItem(bottoms);
  const shoe = randomItem(shoes);

  document.getElementById("result").innerHTML = `

    <p>
      <strong>トップス</strong><br>
      ${top.id}：${top.name}
    </p>

    <p>
      <strong>ボトムス</strong><br>
      ${bottom.id}：${bottom.name}
    </p>

    <p>
      <strong>シューズ</strong><br>
      ${shoe.id}：${shoe.name}
    </p>

  `;
}

loadCSV();

</script>

</body>
</html>
