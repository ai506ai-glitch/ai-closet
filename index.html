<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Closet</title>

<style>
body{
  font-family:sans-serif;
  background:#f5f5f5;
  padding:20px;
  max-width:900px;
  margin:auto;
}

.card{
  background:white;
  border-radius:12px;
  padding:24px;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}

button{
  background:#0078d4;
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
}

button:hover{
  background:#0064b5;
}

.loading{
  color:#666;
}
</style>
</head>

<body>

<h1>AI Closet</h1>

<div class="card">

<h2>今日のおすすめコーデ</h2>

<div id="result" class="loading">
Wardrobe.csv を読み込み中...
</div>

<br>

<button onclick="generateOutfit()">
別のコーデを提案
</button>

</div>

<script>

let tops = [];
let bottoms = [];
let shoes = [];

async function loadCSV() {

  const response = await fetch("Wardrobe.csv");
  const text = await response.text();

  const lines = text.split("\n");

  lines.forEach(line => {

    if(line.startsWith("T")){
      tops.push(line.split(",")[0]);
    }

    if(line.startsWith("B")){
      bottoms.push(line.split(",")[0]);
    }

    if(line.startsWith("S")){
      shoes.push(line.split(",")[0]);
    }

  });

  generateOutfit();
}

function randomItem(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function generateOutfit(){

  if(
    tops.length === 0 ||
    bottoms.length === 0 ||
    shoes.length === 0
  ){
    return;
  }

  const top = randomItem(tops);
  const bottom = randomItem(bottoms);
  const shoe = randomItem(shoes);

  document.getElementById("result").innerHTML = `
    <p><strong>トップス:</strong> ${top}</p>
    <p><strong>ボトムス:</strong> ${bottom}</p>
    <p><strong>シューズ:</strong> ${shoe}</p>
  `;
}

loadCSV();

</script>

</body>
</html>
